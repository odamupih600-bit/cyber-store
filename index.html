<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجر الخدمات الرقمية</title>
    
    <!-- خط Tajawal وأيقونات FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* CSS Design Tokens - أنظمة الألوان والتنسيق القياسية */
        :root {
            --bg-body: #0d1117;
            --surface-card: #161b22;
            --surface-hover: #21262d;
            --border-color: rgba(240, 246, 252, 0.1);
            --primary-glow: #00f2fe;
            --primary-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --accent-purple: #7928ca;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --success: #2ea043;
            --danger: #da3633;
            --radius-lg: 18px;
            --radius-sm: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            padding-bottom: 90px;
            overflow-x: hidden;
            user-select: none;
        }

        /* الهيدر العلوي المتجاوب */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            color: #000;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
        }

        .user-details h4 { font-size: 14px; font-weight: 800; line-height: 1.2; }
        .user-details span { font-size: 11px; color: var(--text-secondary); }

        .wallet-badge {
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 6px 12px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--primary-glow);
            font-size: 13px;
            font-weight: 800;
        }

        /* البانر الرئيسي */
        .hero-banner {
            margin: 16px;
            padding: 20px;
            border-radius: var(--radius-lg);
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .hero-banner::after {
            content: '';
            position: absolute;
            top: -40%;
            left: -40%;
            width: 180%;
            height: 180%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-title { font-size: 18px; font-weight: 900; margin-bottom: 4px; }
        .hero-sub { font-size: 12px; color: rgba(255, 255, 255, 0.8); }

        /* شريط التبويبات الفئوية */
        .category-nav {
            display: flex;
            gap: 8px;
            padding: 0 16px 12px 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .category-nav::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn.active {
            background: var(--primary-gradient);
            color: #000;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(0, 242, 254, 0.3);
        }

        /* شبكة المنتجات */
        .section-header {
            padding: 4px 16px 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title { font-size: 15px; font-weight: 800; }

        .store-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 0 16px;
        }

        .product-card {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .product-card:active {
            transform: scale(0.97);
        }

        .product-image {
            width: 100%;
            height: 110px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            margin-bottom: 10px;
        }

        .product-name {
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-tag {
            font-size: 10px;
            color: var(--primary-glow);
            background: rgba(0, 242, 254, 0.08);
            padding: 2px 6px;
            border-radius: 4px;
            align-self: flex-start;
            margin-bottom: 10px;
        }

        .card-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .btn-charge {
            background: var(--surface-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
        }

        /* نافذة الشراء السفلية (Bottom Sheet Modal) */
        .sheet-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: all 0.25s ease;
            display: flex;
            align-items: flex-end;
        }

        .sheet-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .sheet-content {
            background: var(--surface-card);
            border-top: 1px solid var(--border-color);
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-height: 85vh;
            padding: 20px;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .sheet-overlay.active .sheet-content {
            transform: translateY(0);
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .close-sheet {
            background: var(--surface-hover);
            border: none;
            color: var(--text-secondary);
            width: 32px; height: 32px;
            border-radius: 50%;
            cursor: pointer;
        }

        .input-label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .text-input {
            width: 100%;
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            margin-bottom: 16px;
        }

        .text-input:focus {
            border-color: var(--primary-glow);
        }

        /* شبكة أزرار الحزم */
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .package-card {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .package-card.selected {
            border-color: var(--primary-glow);
            background: rgba(0, 242, 254, 0.05);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.15);
        }

        .pkg-title { font-size: 14px; font-weight: 800; }
        .pkg-price { font-size: 12px; color: var(--primary-glow); font-weight: 700; margin-top: 2px; }

        .btn-submit {
            width: 100%;
            background: var(--primary-gradient);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 242, 254, 0.3);
        }

        /* الشريط السفلي للتنقل */
        .bottom-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(22, 27, 34, 0.9);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 90;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-secondary);
            font-size: 11px;
            gap: 3px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--primary-glow);
            font-weight: 800;
        }

        .nav-item i { font-size: 18px; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="user-profile">
            <div class="avatar" id="u-avatar">U</div>
            <div class="user-details">
                <h4 id="u-name">جاري التحميل...</h4>
                <span id="u-id">ID: -------</span>
            </div>
        </div>
        <div class="wallet-badge">
            <i class="fa-solid fa-wallet"></i>
            <span id="u-balance">0.00 $</span>
        </div>
    </header>

    <!-- Banner -->
    <div class="hero-banner">
        <div class="hero-title">تسليم فوري ومباشر ⚡</div>
        <div class="hero-sub">اشحن ألعابك وتطبيقاتك بلمسة واحدة</div>
    </div>

    <!-- Filter Categories -->
    <div class="category-nav">
        <button class="tab-btn active" onclick="filterItems('all', this)">الكل</button>
        <button class="tab-btn" onclick="filterItems('games', this)">🎮 الألعاب</button>
        <button class="tab-btn" onclick="filterItems('apps', this)">📱 التطبيقات</button>
        <button class="tab-btn" onclick="filterItems('cards', this)">🎁 البطاقات</button>
    </div>

    <!-- Products Grid -->
    <div class="section-header">
        <div class="section-title">العناصر المتاحة</div>
        <span style="font-size: 11px; color: var(--text-secondary);">تحديث تلقائي</span>
    </div>

    <div class="store-grid" id="grid-container">
        <!-- Rendered via JavaScript -->
    </div>

    <!-- Checkout Bottom Sheet -->
    <div class="sheet-overlay" id="checkout-sheet">
        <div class="sheet-content">
            <div class="sheet-header">
                <h3 id="sheet-title" style="font-size: 16px; font-weight: 800;">تأكيد الشحن</h3>
                <button class="close-sheet" onclick="closeSheet()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <label class="input-label"><i class="fa-solid fa-id-badge"></i> معرف الحساب (Player ID):</label>
            <input type="text" id="input-player-id" class="text-input" placeholder="أدخل آيدي الحساب هنا...">

            <label class="input-label">اختر الكمية المطلوب شحنها:</label>
            <div class="packages-grid" id="packages-list">
                <!-- Packages injected here -->
            </div>

            <button class="btn-submit" onclick="confirmPurchase()">تأكيد الطلب للشحن <i class="fa-solid fa-bolt"></i></button>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-bar">
        <div class="nav-item active"><i class="fa-solid fa-store"></i><span>المتجر</span></div>
        <div class="nav-item"><i class="fa-solid fa-list-check"></i><span>طلباتي</span></div>
        <div class="nav-item"><i class="fa-solid fa-clock-rotate-left"></i><span>السجل</span></div>
        <div class="nav-item"><i class="fa-solid fa-headset"></i><span>الدعم</span></div>
    </nav>

    <script>
        // Init Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const user = {
            name: tg?.initDataUnsafe?.user?.first_name || "مستخدم جديد",
            id: tg?.initDataUnsafe?.user?.id || "7495506408"
        };

        document.getElementById('u-name').innerText = user.name;
        document.getElementById('u-id').innerText = `ID: ${user.id}`;
        document.getElementById('u-avatar').innerText = user.name.charAt(0).toUpperCase();

        // Catalog Data
        const storeCatalog = [
            {
                id: 'pubg',
                category: 'games',
                name: 'ببجي موبايل (PUBG)',
                tag: 'تسليم آلي ID',
                image: 'https://img.freepik.com/free-vector/gradient-esports-logo-design_23-2149021873.jpg',
                packages: [
                    { qty: '60 UC', price: '1.25 $' },
                    { qty: '325 UC', price: '5.10 $' },
                    { qty: '660 UC', price: '9.90 $' },
                    { qty: '1800 UC', price: '24.90 $' }
                ]
            },
            {
                id: 'freefire',
                category: 'games',
                name: 'فري فاير (Free Fire)',
                tag: 'جواهر مباشرة',
                image: 'https://img.freepik.com/free-vector/gaming-badge-logo-template_23-2148842602.jpg',
                packages: [
                    { qty: '100 Diamond', price: '1.00 $' },
                    { qty: '310 Diamond', price: '3.10 $' },
                    { qty: '520 Diamond', price: '5.00 $' }
                ]
            },
            {
                id: 'tiktok',
                category: 'apps',
                name: 'عملات تيك توك',
                tag: 'شحن حسابات',
                image: 'https://img.freepik.com/free-vector/gradient-social-media-concept_23-2148496458.jpg',
                packages: [
                    { qty: '70 Coins', price: '1.15 $' },
                    { qty: '350 Coins', price: '5.30 $' }
                ]
            }
        ];

        let activeProduct = null;
        let activePackage = null;

        function renderCatalog(category = 'all') {
            const grid = document.getElementById('grid-container');
            grid.innerHTML = '';

            const list = category === 'all' ? storeCatalog : storeCatalog.filter(i => i.category === category);

            list.forEach(item => {
                grid.innerHTML += `
                    <div class="product-card" onclick="openSheet('${item.id}')">
                        <div>
                            <img src="${item.image}" class="product-image" alt="${item.name}">
                            <div class="product-name">${item.name}</div>
                            <div class="product-tag">${item.tag}</div>
                        </div>
                        <div class="card-action">
                            <span style="font-size: 11px; color: var(--text-secondary);">من ${item.packages[0].price}</span>
                            <button class="btn-charge">شحن</button>
                        </div>
                    </div>
                `;
            });
        }

        function filterItems(cat, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderCatalog(cat);
        }

        function openSheet(id) {
            activeProduct = storeCatalog.find(p => p.id === id);
            activePackage = null;

            document.getElementById('sheet-title').innerText = `شحن ${activeProduct.name}`;
            const pkgBox = document.getElementById('packages-list');
            pkgBox.innerHTML = '';

            activeProduct.packages.forEach(pkg => {
                pkgBox.innerHTML += `
                    <div class="package-card" onclick="selectPkg(this, '${pkg.qty}', '${pkg.price}')">
                        <div class="pkg-title">${pkg.qty}</div>
                        <div class="pkg-price">${pkg.price}</div>
                    </div>
                `;
            });

            document.getElementById('checkout-sheet').classList.add('active');
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        function selectPkg(el, qty, price) {
            document.querySelectorAll('.package-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            activePackage = { qty, price };
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function closeSheet() {
            document.getElementById('checkout-sheet').classList.remove('active');
        }

        function confirmPurchase() {
            const playerId = document.getElementById('input-player-id').value.trim();

            if (!playerId) {
                alert('يرجى إدخال معرف الحساب (ID)');
                return;
            }

            if (!activePackage) {
                alert('يرجى اختيار الحزمة المطلوبة');
                return;
            }

            const data = {
                user_id: user.id,
                item: activeProduct.name,
                player_id: playerId,
                package: activePackage.qty,
                price: activePackage.price
            };

            if (tg && tg.sendData) {
                tg.sendData(JSON.stringify(data));
            } else {
                alert(`تم تأكيد الطلب بنجاح:\n${activeProduct.name}\nالحزمة: ${activePackage.qty}\nالـ ID: ${playerId}`);
                closeSheet();
            }
        }

        // Render initially
        renderCatalog();
    </script>
</body>
</html>
