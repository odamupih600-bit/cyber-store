<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجر الشحن الرقمي | Cyber Charge</title>
    
    <!-- خط Tajawal وأيقونات FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #151c2c;
            --card-border: #232d42;
            --accent-glow: #00d2ff;
            --accent-purple: #7f5af0;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding-bottom: 85px;
            user-select: none;
        }

        /* الهيدر العلوي */
        .app-header {
            background: rgba(21, 28, 44, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 99;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-glow));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        .user-meta h4 { font-size: 14px; font-weight: 700; }
        .user-meta span { font-size: 11px; color: var(--text-sub); }

        .balance-badge {
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--accent-glow);
            font-size: 13px;
            font-weight: 800;
        }

        /* البانر الترويجي */
        .hero-banner {
            margin: 15px 16px;
            background: linear-gradient(135deg, #1e1b4b, #31103f);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 18px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hero-banner::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,210,255,0.1) 0%, transparent 60%);
            pointer-events: none;
        }

        .hero-text h3 { font-size: 18px; font-weight: 900; color: #fff; margin-bottom: 4px; }
        .hero-text p { font-size: 12px; color: var(--text-sub); }

        /* شريط التبنيبات / الفئات */
        .categories-bar {
            display: flex;
            gap: 10px;
            padding: 0 16px 15px 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .categories-bar::-webkit-scrollbar { display: none; }

        .cat-chip {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-sub);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cat-chip.active {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-glow));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(127, 90, 240, 0.4);
        }

        /* شبكة المنتجات والألعاب */
        .section-title {
            padding: 0 16px 10px 16px;
            font-size: 15px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 0 16px;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 12px;
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }

        .game-card:active { transform: scale(0.97); }

        .game-thumb {
            width: 100%;
            height: 110px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .game-title {
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-tag {
            font-size: 10px;
            color: var(--accent-glow);
            background: rgba(0, 210, 255, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .game-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-buy {
            background: var(--accent-purple);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
        }

        /* النافذة المنبثقة للشراء (Drawer / Modal) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: none;
            align-items: flex-end;
        }

        .modal-overlay.active { display: flex; }

        .drawer-content {
            background: var(--card-bg);
            border-top: 1px solid var(--card-border);
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px;
            animation: slideUp 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 6px;
            font-weight: 700;
        }

        .custom-input {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .custom-input:focus {
            border-color: var(--accent-glow);
        }

        /* حزم الكميات / الشدات / الجواهر */
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .package-item {
            background: var(--bg-dark);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .package-item.selected {
            border-color: var(--accent-glow);
            background: rgba(0, 210, 255, 0.08);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        .pkg-amount { font-size: 14px; font-weight: 800; color: #fff; }
        .pkg-price { font-size: 12px; color: var(--accent-glow); font-weight: 700; margin-top: 4px; }

        .btn-confirm {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-glow));
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        /* الشريط السفلي */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(21, 28, 44, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 900;
        }

        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-sub);
            font-size: 11px;
            gap: 4px;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-link.active { color: var(--accent-glow); font-weight: 800; }
        .nav-link i { font-size: 18px; }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header class="app-header">
        <div class="user-pill">
            <div class="user-avatar" id="u-avatar">U</div>
            <div class="user-meta">
                <h4 id="u-name">جاري التحميل...</h4>
                <span id="u-id">ID: -------</span>
            </div>
        </div>
        <div class="balance-badge">
            <i class="fa-solid fa-wallet"></i>
            <span id="u-balance">0.00 $</span>
        </div>
    </header>

    <!-- البانر -->
    <section class="hero-banner">
        <div class="hero-text">
            <h3>شحن فوري ومباشر ⚡</h3>
            <p>شدات، جواهر، اشتراكات بأفضل الأسعار</p>
        </div>
        <i class="fa-solid fa-bolt" style="font-size: 38px; color: var(--accent-glow);"></i>
    </section>

    <!-- الفئات -->
    <nav class="categories-bar">
        <div class="cat-chip active" onclick="filterCat('all', this)">⚡ الكل</div>
        <div class="cat-chip" onclick="filterCat('games', this)">🎮 الألعاب</div>
        <div class="cat-chip" onclick="filterCat('apps', this)">📱 التطبيقات</div>
        <div class="cat-chip" onclick="filterCat('cards', this)">🎁 البطاقات</div>
    </nav>

    <!-- قائمة الألعاب والخدمات -->
    <div class="section-title">
        <span>العناصر المتاحة</span>
        <span style="font-size: 11px; color: var(--text-sub);">تحديث لحظي</span>
    </div>

    <main class="products-grid" id="products-container">
        <!-- يتم ملء العناصر تلقائياً عبر JavaScript -->
    </main>

    <!-- نافذة الشراء المنبثقة -->
    <div class="modal-overlay" id="purchase-modal">
        <div class="drawer-content">
            <div class="drawer-header">
                <h3 id="modal-title" style="font-size: 16px; font-weight: 800;">شحن الحساب</h3>
                <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- إدخال ID اللاعب -->
            <div class="input-group">
                <label id="modal-id-label"><i class="fa-solid fa-id-card"></i> معرف اللاعب (Player ID):</label>
                <input type="text" id="player-id-input" class="custom-input" placeholder="أدخل ID الخاص بك هنا">
            </div>

            <!-- اختيار الحزمة -->
            <label style="font-size: 12px; color: var(--text-sub); font-weight: 700; margin-bottom: 8px; display: block;">اختر الكمية المطلوبة:</label>
            <div class="packages-grid" id="packages-container">
                <!-- تجلب الحزم من السكربت -->
            </div>

            <button class="btn-confirm" onclick="submitOrder()"><i class="fa-solid fa-cart-shopping"></i> تأكيد الطلب والشحن</button>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
        <a class="nav-link active"><i class="fa-solid fa-gamepad"></i><span>المتجر</span></a>
        <a class="nav-link"><i class="fa-solid fa-clock-rotate-left"></i><span>طلباتي</span></a>
        <a class="nav-link"><i class="fa-solid fa-wallet"></i><span>شحن رصيد</span></a>
        <a class="nav-link"><i class="fa-solid fa-headset"></i><span>الدعم</span></a>
    </nav>

    <script>
        // تهيئة تليجرام WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // بيانت المستخدم من تليجرام
        const user = {
            name: tg?.initDataUnsafe?.user?.first_name || "مستخدم جديد",
            id: tg?.initDataUnsafe?.user?.id || "123456789"
        };

        document.getElementById('u-name').innerText = user.name;
        document.getElementById('u-id').innerText = `ID: ${user.id}`;
        document.getElementById('u-avatar').innerText = user.name.charAt(0).toUpperCase();

        // بيانات ألعاب وتطبيقات الشحن
        const productsData = [
            {
                id: 'pubg',
                category: 'games',
                title: 'ببجي موبايل (PUBG)',
                tag: 'شحن ID فوري',
                image: 'https://img.freepik.com/free-vector/gradient-esports-logo-design_23-2149021873.jpg',
                packages: [
                    { amount: '60 UC', price: '1.20 $' },
                    { amount: '325 UC', price: '5.00 $' },
                    { amount: '660 UC', price: '9.80 $' },
                    { amount: '1800 UC', price: '24.50 $' }
                ]
            },
            {
                id: 'freefire',
                category: 'games',
                title: 'فري فاير (Free Fire)',
                tag: 'جواهر عن طريق المعرف',
                image: 'https://img.freepik.com/free-vector/gaming-badge-logo-template_23-2148842602.jpg',
                packages: [
                    { amount: '100 Diamond', price: '1.00 $' },
                    { amount: '310 Diamond', price: '3.00 $' },
                    { amount: '520 Diamond', price: '5.00 $' },
                    { amount: '1060 Diamond', price: '10.00 $' }
                ]
            },
            {
                id: 'tiktok',
                category: 'apps',
                title: 'عملات تيك توك (TikTok)',
                tag: 'عملات هدايا',
                image: 'https://img.freepik.com/free-vector/gradient-social-media-concept_23-2148496458.jpg',
                packages: [
                    { amount: '70 Coins', price: '1.10 $' },
                    { amount: '350 Coins', price: '5.20 $' },
                    { amount: '1400 Coins', price: '20.00 $' }
                ]
            },
            {
                id: 'ludo',
                category: 'games',
                title: 'يلا لودو (Yalla Ludo)',
                tag: 'أماس وذهب',
                image: 'https://img.freepik.com/free-vector/flat-design-game-controller-logo_23-2148821035.jpg',
                packages: [
                    { amount: '40 Gems', price: '1.00 $' },
                    { amount: '260 Gems', price: '5.00 $' },
                    { amount: '1350 Gems', price: '24.00 $' }
                ]
            }
        ];

        let selectedProduct = null;
        let selectedPackage = null;

        // عرض المنتجات
        function renderProducts(filter = 'all') {
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            const filtered = filter === 'all' ? productsData : productsData.filter(p => p.category === filter);

            filtered.forEach(prod => {
                container.innerHTML += `
                    <div class="game-card" onclick="openPurchaseModal('${prod.id}')">
                        <img src="${prod.image}" class="game-thumb" alt="${prod.title}">
                        <div class="game-title">${prod.title}</div>
                        <span class="game-tag">${prod.tag}</span>
                        <div class="game-footer">
                            <span style="font-size:11px; color:var(--text-sub);">تبدأ من ${prod.packages[0].price}</span>
                            <button class="btn-buy">شحن</button>
                        </div>
                    </div>
                `;
            });
        }

        // فلترة الفئات
        function filterCat(cat, element) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            renderProducts(cat);
        }

        // فتح نافذة الشراء
        function openPurchaseModal(productId) {
            selectedProduct = productsData.find(p => p.id === productId);
            selectedPackage = null;

            document.getElementById('modal-title').innerText = `شحن ${selectedProduct.title}`;
            const pkgContainer = document.getElementById('packages-container');
            pkgContainer.innerHTML = '';

            selectedProduct.packages.forEach((pkg, index) => {
                pkgContainer.innerHTML += `
                    <div class="package-item" onclick="selectPackage(this, '${pkg.amount}', '${pkg.price}')">
                        <div class="pkg-amount">${pkg.amount}</div>
                        <div class="pkg-price">${pkg.price}</div>
                    </div>
                `;
            });

            document.getElementById('purchase-modal').classList.add('active');
        }

        // تحديد الحزمة
        function selectPackage(element, amount, price) {
            document.querySelectorAll('.package-item').forEach(i => i.classList.remove('selected'));
            element.classList.add('selected');
            selectedPackage = { amount, price };
        }

        // إغلاق النافذة
        function closeModal() {
            document.getElementById('purchase-modal').classList.remove('active');
        }

        // تقديم الطلب
        function submitOrder() {
            const playerId = document.getElementById('player-id-input').value.trim();

            if (!playerId) {
                alert('يرجى إدخال ID اللاعب أولاً!');
                return;
            }

            if (!selectedPackage) {
                alert('يرجى اختيار الحزمة المطلوب شحنها!');
                return;
            }

            const orderPayload = {
                user_id: user.id,
                user_name: user.name,
                game: selectedProduct.title,
                player_id: playerId,
                package: selectedPackage.amount,
                price: selectedPackage.price
            };

            // إرسال البيانات فوراً لـ Telegram Bot
            if (tg && tg.sendData) {
                tg.sendData(JSON.stringify(orderPayload));
            } else {
                alert(`تم تأكيد طلبك بنجاح!\nالخدمة: ${selectedProduct.title}\nالـ ID: ${playerId}\nالحزمة: ${selectedPackage.amount}`);
                closeModal();
            }
        }

        // التشغيل المبدئي
        renderProducts();
    </script>
</body>
</html>
