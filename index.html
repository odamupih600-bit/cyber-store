<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر شحن الألعاب والبطاقات الرقمية</title>
    <!-- خط Google Cairo المفضل للواجهات العربية -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #4f46e5;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-color);
            padding-bottom: 60px;
        }

        /* الهيدر ونظام العملات */
        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .currency-settings {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select {
            background-color: var(--dark-bg);
            color: var(--text-color);
            border: 1px solid var(--primary-color);
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-save {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-save:hover {
            opacity: 0.9;
        }

        /* القائمة العلوية للتنقل بين الأيقونات */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            background: rgba(30, 41, 59, 0.5);
            overflow-x: auto;
        }

        .tab-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 2px solid transparent;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
            transition: 0.3s;
        }

        .tab-btn.active, .tab-btn:hover {
            border-color: var(--primary-color);
            background: var(--primary-color);
        }

        /* حاويات المحتوى */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        /* تصميم كروت الشحن */
        .item-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
        }

        .item-card:hover {
            transform: translateY(-5px);
        }

        .item-image {
            width: 100%;
            height: 160px;
            background: linear-gradient(45deg, #1e1b4b, #311042);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .item-details {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .item-price {
            font-size: 16px;
            color: var(--accent-color);
            font-weight: 600;
            margin-bottom: 15px;
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .quantity-selector input {
            width: 60px;
            padding: 5px;
            background: var(--dark-bg);
            border: 1px solid #475569;
            color: white;
            text-align: center;
            border-radius: 6px;
        }

        .btn-buy {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        /* نافذة الدفع (البوب أب) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            background: var(--dark-bg);
            border: 1px solid #475569;
            color: white;
            border-radius: 8px;
        }

        .invoice-summary {
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .btn-cancel {
            background: #64748b;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            flex: 1;
        }
    </style>
</head>
<body>

    <!-- الهيدر ونظام حفظ العملات -->
    <header>
        <div class="logo">🎮 متجر الشحن السريع</div>
        <div class="currency-settings">
            <label for="currencySelect">العملة:</label>
            <select id="currencySelect">
                <option value="USD" data-symbol="$" data-rate="1">USD ($)</option>
                <option value="SAR" data-symbol="ر.س" data-rate="3.75">SAR (ر.س)</option>
                <option value="EGP" data-symbol="ج.م" data-rate="47">EGP (ج.م)</option>
            </select>
            <button class="btn-save" onclick="saveCurrencySettings()">حفظ</button>
        </div>
    </header>

    <!-- أزرار التنقل بين الأيقونات والأقسام -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('games')">🕹️ شحن ألعاب</button>
        <button class="tab-btn" onclick="switchTab('cards')">💳 بطاقات رقمية</button>
        <button class="tab-btn" onclick="switchTab('deposit')">💰 إيداع رصيد</button>
    </div>

    <!-- محتوى الأقسام -->
    <div class="container">
        
        <!-- قسم الألعاب -->
        <div id="games" class="tab-content active">
            <!-- كرت ببجي -->
            <div class="item-card" data-base-price="10">
                <div class="item-image">🔫</div>
                <div class="item-details">
                    <div class="item-title">شدات ببجي موبايل (660 UC)</div>
                    <div class="item-price">السعر: <span class="price-val">10</span> <span class="curr-symbol">$</span></div>
                    <div class="quantity-selector">
                        <label>الكمية:</label>
                        <input type="number" value="1" min="1" onchange="calculateItemPrice(this)">
                    </div>
                    <button class="btn-buy" onclick="openCheckout('شدات ببجي موبايل (660 UC)', this)">شحن الآن</button>
                </div>
            </div>

            <!-- كرت فري فاير -->
            <div class="item-card" data-base-price="5">
                <div class="item-image">🔥</div>
                <div class="item-details">
                    <div class="item-title">جواهر فري فاير (530 جوهرة)</div>
                    <div class="item-price">السعر: <span class="price-val">5</span> <span class="curr-symbol">$</span></div>
                    <div class="quantity-selector">
                        <label>الكمية:</label>
                        <input type="number" value="1" min="1" onchange="calculateItemPrice(this)">
                    </div>
                    <button class="btn-buy" onclick="openCheckout('جواهر فري فاير (530 جوهرة)', this)">شحن الآن</button>
                </div>
            </div>
        </div>

        <!-- قسم البطاقات الرقمية -->
        <div id="cards" class="tab-content">
            <div class="item-card" data-base-price="15">
                <div class="item-image">🍏</div>
