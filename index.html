<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الشحن الإلكتروني | Cyber Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --accent-color: #00ff88;
            --accent-hover: #00cc6a;
            --text-color: #ffffff;
            --text-secondary: #94a3b8;
            --border-color: #2a354f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 40px;
        }

        /* Header */
        header {
            background: rgba(21, 28, 44, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .status-badge {
            background: rgba(0, 255, 136, 0.1);
            color: var(--accent-color);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid var(--accent-color);
        }

        /* Hero Banner */
        .hero {
            text-align: center;
            padding: 40px 20px;
            background: radial-gradient(circle at center, #1e293b 0%, var(--bg-color) 100%);
        }

        .hero h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Products Grid */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s, border-color 0.3s;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .card img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .card h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .card .price {
            font-size: 1.1rem;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 15px;
        }

        .btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">CYBER STORE</div>
        <div class="status-badge">● متصل الآن</div>
    </header>

    <section class="hero">
        <h1>متجر الشحن السريع والآمن</h1>
        <p>اختر الخدمة، أدخل معرف حسابك (ID)، واستلم الطلب فوراً</p>
    </section>

    <main class="container">
        <div class="grid">
            <!-- منتج 1 -->
            <div class="card">
                <img src="https://cdn-icons-png.flaticon.com/512/808/808432.png" alt="Free Fire">
                <h3>فري فاير - 100-110 جوهرة</h3>
                <div class="price">$1.00</div>
                <button class="btn" onclick="openOrderModal('فري فاير - 100 جوهرة', '$1.00')">طلب الآن</button>
            </div>

            <!-- منتج 2 -->
            <div class="card">
                <img src="https://cdn-icons-png.flaticon.com/512/808/808432.png" alt="Free Fire">
                <h3>فري فاير - 530 جوهرة</h3>
                <div class="price">$5.00</div>
                <button class="btn" onclick="openOrderModal('فري فاير - 530 جوهرة', '$5.00')">طلب الآن</button>
            </div>

            <!-- منتج 3 -->
            <div class="card">
                <img src="https://cdn-icons-png.flaticon.com/512/3408/3408506.png" alt="PUBG">
                <h3>ببجي موبايل - 60 شدة</h3>
                <div class="price">$0.99</div>
                <button class="btn" onclick="openOrderModal('ببجي - 60 شدة', '$0.99')">طلب الآن</button>
            </div>

            <!-- منتج 4 -->
            <div class="card">
                <img src="https://cdn-icons-png.flaticon.com/512/3408/3408506.png" alt="PUBG">
                <h3>ببجي موبايل - 325 شدة</h3>
                <div class="price">$4.99</div>
                <button class="btn" onclick="openOrderModal('ببجي - 325 شدة', '$4.99')">طلب الآن</button>
            </div>
        </div>
    </main>

    <!-- نافذة الشراء (Modal) -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeOrderModal()">&times;</button>
            <h2 id="modalTitle" style="margin-bottom: 15px; font-size: 1.3rem;">تأكيد الطلب</h2>
            
            <div class="form-group">
                <label>معرف الحساب (Player ID):</label>
                <input type="text" id="playerId" placeholder="أدخل ID الخاص بك هنا">
            </div>

            <div class="form-group">
                <label>اسم الحساب (اختياري):</label>
                <input type="text" id="playerName" placeholder="اسمك في اللعبة">
            </div>

            <button class="btn" onclick="sendOrder()">إرسال الطلب عبر تليجرام</button>
        </div>
    </div>

    <script>
        let currentProduct = '';
        let currentPrice = '';

        // ضع يوزر حسابك أو البوت في تليجرام هنا
        const TELEGRAM_USERNAME = "YourTelegramUsername"; 

        function openOrderModal(product, price) {
            currentProduct = product;
            currentPrice = price;
            document.getElementById('modalTitle').innerText = product + " (" + price + ")";
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeOrderModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        function sendOrder() {
            const id = document.getElementById('playerId').value;
            const name = document.getElementById('playerName').value || 'غير محدد';

            if (!id) {
                alert('يرجى إدخال معرف الحساب (ID)');
                return;
            }

            const message = `طلب جديد من المتجر:%0A- الخدمة: ${currentProduct}%0A- السعر: ${currentPrice}%0A- ID الحساب: ${id}%0A- اسم الحساب: ${name}`;
            
            // التحويل المباشر لتليجرام مع صياغة الرسالة
            window.open(`https://t.me/${TELEGRAM_USERNAME}?text=${message}`, '_blank');
            closeOrderModal();
        }
    </script>
</body>
</html>
