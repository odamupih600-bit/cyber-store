<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة المتجر ⚙️</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; color: #38bdf8; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #334155;
            box-sizing: border-box;
            font-size: 16px;
        }
        input { background: #0f172a; color: #fff; }
        button {
            background: #0284c7;
            color: #fff;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #0369a1; }
        .hidden { display: none; }
        .section {
            border-top: 1px solid #334155;
            margin-top: 20px;
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- شاشة تسجيل الدخول -->
    <div id="login-box">
        <h2>🔒 تسجيل دخول الأدمن</h2>
        <input type="password" id="admin-pass" placeholder="أدخل كلمة السر هنا...">
        <button onclick="login()">دخول</button>
        <p id="login-err" style="color: #ef4444; text-align: center;"></p>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="admin-panel" class="hidden">
        <h2>⚙️ لوحة التحكم بالمتجر</h2>
        
        <!-- قسم إضافة منتج -->
        <div class="section">
            <h3>📦 إضافة منتج جديد</h3>
            <input type="text" id="prod-name" placeholder="اسم المنتج (مثال: 60 شدة ببجي)">
            <input type="number" id="prod-price" placeholder="السعر بالـ $">
            <button onclick="addProduct()">➕ إضافة المنتج</button>
        </div>

        <!-- قسم شحن رصيد للزبون -->
        <div class="section">
            <h3>💳 شحن رصيد لزبون</h3>
            <input type="text" id="user-id" placeholder="أيدي الزبون (Telegram ID)">
            <input type="number" id="charge-amount" placeholder="المبلغ المراد شحنه ($)">
            <button onclick="addBalance()">⚡ شحن الرصيد فوراً</button>
        </div>

        <button onclick="logout()" style="background: #dc2626; margin-top: 25px;">خروج</button>
    </div>
</div>

<script>
    // كلمة السر الحالية للوحة هي: admin123
    const ADMIN_PASSWORD = "admin123";

    function login() {
        const passInput = document.getElementById('admin-pass').value;
        if (passInput === ADMIN_PASSWORD) {
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
        } else {
            document.getElementById('login-err').innerText = "❌ كلمة السر غير صحيحة!";
        }
    }

    function addProduct() {
        const name = document.getElementById('prod-name').value;
        const price = document.getElementById('prod-price').value;

        if (!name || !price) {
            alert("يرجى ملء جميع الحقول!");
            return;
        }

        alert(`✅ تم إضافة المنتج: ${name} بسعر $${price} بنجاح!`);
        document.getElementById('prod-name').value = '';
        document.getElementById('prod-price').value = '';
    }

    function addBalance() {
        const userId = document.getElementById('user-id').value;
        const amount = document.getElementById('charge-amount').value;

        if (!userId || !amount) {
            alert("يرجى أدخل أيدي الزبون والمبلغ!");
            return;
        }

        alert(`✅ تم شحن مبلغ $${amount} للزبون صاحب الأيدي: ${userId}`);
        document.getElementById('user-id').value = '';
        document.getElementById('charge-amount').value = '';
    }

    function logout() {
        location.reload();
    }
</script>

</body>
</html>
