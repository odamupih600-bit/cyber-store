<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شحن التطبيقات - CYBER STORE</title>
    <!-- خط Cairo والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2e;
            --accent-purple: #7c3aed;
            --accent-blue: #3b82f6;
            --text-main: #ffffff;
            --text-sub: #9ca3af;
            --input-bg: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        /* الهيدر */
        .page-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .back-btn {
            background: var(--card-bg);
            border: none;
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .page-title {
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* اختيار التطبيق */
        .section-label {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-sub);
        }

        .apps-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .app-item {
            min-width: 80px;
            background: var(--card-bg);
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .app-item.active {
            border-color: var(--accent-purple);
            background: rgba(124, 58, 237, 0.15);
        }

        .app-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        .app-name {
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* حقل الآيدي ID */
        .form-group {
            margin-bottom: 20px;
        }

        .input-box {
            position: relative;
        }

        .input-box input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 16px;
            padding-left: 40px;
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .input-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
        }

        /* شبكة باقات الشحن */
        .packages-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .pkg-card {
            background: var(--card-bg);
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 14px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        .pkg-card.selected {
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.1);
        }

        .pkg-amount {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
        }

        .pkg-price {
            font-size: 0.85rem;
            color: var(--accent-blue);
            font-weight: 700;
        }

        /* زر التأكيد */
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- رأس الصفحة -->
    <div class="page-header">
        <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-arrow-right"></i></button>
        <div class="page-title">شحن التطبيقات والألعاب</div>
    </div>

    <!-- 1. اختيار التطبيق -->
    <div class="section-label">اختر التطبيق / اللعبة:</div>
    <div class="apps-scroll">
        <div class="app-item active" onclick="selectApp(this, 'ببجي موبايل')">
            <div class="app-icon" style="background: rgba(245, 158, 11, 0.2); color: #f59e0b;">
                <i class="fa-solid fa-crosshairs"></i>
            </div>
            <span class="app-name">PUBG</span>
        </div>

        <div class="app-item" onclick="selectApp(this, 'فري فاير')">
            <div class="app-icon" style="background: rgba(239, 68, 68, 0.2); color: #ef4444;">
                <i class="fa-solid fa-fire"></i>
            </div>
            <span class="app-name">Free Fire</span>
        </div>

        <div class="app-item" onclick="selectApp(this, 'تيك توك')">
            <div class="app-icon" style="background: rgba(236, 72, 153, 0.2); color: #ec4899;">
                <i class="fa-brands fa-tiktok"></i>
            </div>
            <span class="app-name">TikTok</span>
        </div>

        <div class="app-item" onclick="selectApp(this, 'يلا لودو')">
            <div class="app-icon" style="background: rgba(16, 185, 129, 0.2); color: #10b981;">
                <i class="fa-solid fa-dice"></i>
            </div>
            <span class="app-name">Yalla Ludo</span>
        </div>
    </div>

    <!-- 2. أدخل معرف الحساب -->
    <div class="form-group">
        <div class="section-label">رقم المعرف (Player ID / Username):</div>
        <div class="input-box">
            <input type="text" id="userId" placeholder="أدخل ID الحساب هنا...">
            <i class="fa-solid fa-id-card"></i>
        </div>
    </div>

    <!-- 3. اختيار الباقة -->
    <div class="section-label">اختر الباقة المناسبة:</div>
    <div class="packages-grid">
        <div class="pkg-card selected" onclick="selectPackage(this, '60 UC / جواهر', '15,000 ل.س')">
            <div class="pkg-amount">60 UC</div>
            <div class="pkg-price">15,000 ل.س</div>
        </div>

        <div class="pkg-card" onclick="selectPackage(this, '325 UC / جواهر', '75,000 ل.س')">
            <div class="pkg-amount">325 UC</div>
            <div class="pkg-price">75,000 ل.س</div>
        </div>

        <div class="pkg-card" onclick="selectPackage(this, '660 UC / جواهر', '140,000 ل.س')">
            <div class="pkg-amount">660 UC</div>
            <div class="pkg-price">140,000 ل.س</div>
        </div>

        <div class="pkg-card" onclick="selectPackage(this, '1800 UC / جواهر', '370,000 ل.س')">
            <div class="pkg-amount">1800 UC</div>
            <div class="pkg-price">370,000 ل.س</div>
        </div>
    </div>

    <!-- 4. زر الإرسال -->
    <button class="submit-btn" onclick="submitOrder()">
        <i class="fa-solid fa-bolt"></i> تأكيد وإرسال الطلب
    </button>

</div>

<script>
    let selectedApp = 'ببجي موبايل';
    let selectedPkg = '60 UC / جواهر';
    let selectedPrice = '15,000 ل.س';

    function selectApp(element, appName) {
        document.querySelectorAll('.app-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        selectedApp = appName;
    }

    function selectPackage(element, pkgName, price) {
        document.querySelectorAll('.pkg-card').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        selectedPkg = pkgName;
        selectedPrice = price;
    }

    function submitOrder() {
        const id = document.getElementById('userId').value.trim();
        if (!id) {
            alert('يرجى كتابة رقم الـ ID أو اسم المستخدم الخاص بالحساب أولاً!');
            return;
        }

        alert(`تم استلام طلبك بنجاح!
-----------------------
التطبيق: ${selectedApp}
الـ ID: ${id}
الباقة: ${selectedPkg}
السعر: ${selectedPrice}`);
    }
</script>

</body>
</html>
